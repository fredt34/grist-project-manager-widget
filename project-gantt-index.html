<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramme de Gantt des Projets</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link rel="stylesheet" href="pg.css">
</head>
<body>
    <div class="pg-app-container">
        <header class="pg-header" style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; background: white; border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); flex-wrap: wrap; gap: 0.5rem;">
            <h1 class="pg-title" style="margin: 0; font-size: 1.1rem; font-weight: 600; color: #1e293b; white-space: nowrap;">📊 Gantt des Projets</h1>

            <div class="pg-controls" style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">

                <!-- Vue selector -->
                <div style="display: flex; align-items: center; gap: 0.4rem;">
                    <label for="mode-select" style="font-size: 0.8rem; color: #64748b; white-space: nowrap;">Vue :</label>
                    <select id="mode-select" onchange="setGanttMode(this.value)" style="padding: 0.25rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.8rem;">
                        <option value="days">Jours</option>
                        <option value="weeks">Semaines</option>
                        <option value="months" selected>Mois</option>
                        <option value="year">Année</option>
                        <option value="twoyears">2 Ans</option>
                    </select>
                </div>

                <!-- Navigation: ◀ year-select ▶ -->
                <div style="display: flex; align-items: center; gap: 0.25rem;">
                    <button class="btn-nav" onclick="navigatePrev()" title="Précédent">◀</button>
                    <select id="year-select" onchange="setGanttYear(this.value)" style="padding: 0.25rem 0.4rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.8rem;"></select>
                    <button class="btn-nav" onclick="navigateNext()" title="Suivant">▶</button>
                </div>

                <!-- Today -->
                <button class="btn-today" onclick="resetToToday()">Aujourd'hui</button>

                <!-- Export PNG -->
                <button class="btn-export" onclick="exportToPng()" title="Exporter en PNG">📷 PNG</button>

            </div>
        </header>

        <div id="gantt-view">
            <div style="text-align: center; padding: 40px; color: #64748b;">Chargement des données Grist…</div>
        </div>
    </div>

    <script src="pg.js"></script>
    <script>
        // Populate year selector
        document.addEventListener('DOMContentLoaded', function() {
            var yearSelect = document.getElementById('year-select');
            if (yearSelect) {
                var currentYear = new Date().getFullYear();
                for (var y = currentYear - 3; y <= currentYear + 6; y++) {
                    var opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y;
                    if (y === currentYear) opt.selected = true;
                    yearSelect.appendChild(opt);
                }
            }
        });

        function resetToToday() {
            var now = new Date();
            // Reset internal state
            if (typeof ganttYear !== 'undefined') window.ganttYear = now.getFullYear();
            if (typeof ganttMonth !== 'undefined') window.ganttMonth = now.getMonth();
            // Update year selector
            var sel = document.getElementById('year-select');
            if (sel) sel.value = now.getFullYear();
            // Re-render
            if (typeof setGanttYear === 'function') setGanttYear(now.getFullYear());
        }
    </script>
</body>
</html>
